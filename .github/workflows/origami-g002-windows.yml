name: Origami G002 Windows Runtime Probe

on:
  push:
    paths:
      - "projects/origami-g002/**"
      - ".github/workflows/origami-g002-windows.yml"
  pull_request:
    paths:
      - "projects/origami-g002/**"
      - ".github/workflows/origami-g002-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ZIG_VERSION: "0.14.1"
  ZIG_WINDOWS_SHA256: "554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c"

jobs:
  windows-runtime:
    name: Windows x64 / Zig 0.14.1 / Origami 1.3.0
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: projects/origami-g002

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFY_SHA }}
          persist-credentials: false

      - name: Verify Git source identity
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:VERIFY_SHA) {
            throw "source revision mismatch: expected $env:VERIFY_SHA, got $head"
          }
          Write-Host "verified-head=$head"

      - name: Verify imported source manifest
        run: |
          @'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          manifest = json.loads((root / "SOURCE_MANIFEST.json").read_text(encoding="utf-8"))
          checked = 0
          for row in manifest["files"]:
              repo_path = "projects/origami-g002/" + row["path"]
              data = subprocess.check_output(["git", "show", "HEAD:" + repo_path])
              digest = hashlib.sha256(data).hexdigest()
              assert digest == row["sha256"], (row["path"], digest, row["sha256"])
              assert len(data) == row["bytes"], (row["path"], len(data), row["bytes"])
              checked += 1
          print(f"source-manifest: {checked}/{len(manifest['files'])} exact Git blobs")
          '@ | python -

      - name: Install exact Zig 0.14.1
        run: |
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION-windows-x86_64.zip"
          $root = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZIG_WINDOWS_SHA256) {
            throw "Zig archive SHA-256 mismatch: expected $env:ZIG_WINDOWS_SHA256, got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $zigDir = Join-Path $root "zig-x86_64-windows-$env:ZIG_VERSION"
          $zigExe = Join-Path $zigDir "zig.exe"
          if (-not (Test-Path $zigExe)) { throw "zig.exe not found at $zigExe" }
          $zigDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "zig-archive-sha256=$actual"

      - name: Toolchain identity
        run: |
          $version = (zig version).Trim()
          if ($version -ne $env:ZIG_VERSION) { throw "expected Zig $env:ZIG_VERSION, got $version" }
          python --version
          node --version
          Write-Host "zig-version=$version"

      - name: Native Windows build
        run: python scripts/build.py --target windows

      - name: Verify generated source identity
        run: |
          @'
          import pathlib
          import subprocess

          for rel in ["program/origami.rmal", "native/origami_program.h"]:
              expected = subprocess.check_output(
                  ["git", "show", "HEAD:projects/origami-g002/" + rel]
              ).decode("utf-8")
              actual = pathlib.Path(rel).read_text(encoding="utf-8")
              assert actual == expected, rel + " regenerated text differs from exact-head source"
          print("generated-source: text-identical after Windows newline normalization")
          '@ | python -
          if (-not (Test-Path "build/windows/origami.exe")) {
            throw "build/windows/origami.exe was not produced"
          }

      - name: Centering sampler
        run: |
          $out = & python tests/centering.py --binary build/windows/origami.exe 2>&1
          $code = $LASTEXITCODE
          $out | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/centering.txt"
          $out
          if ($code -ne 0) { exit $code }

      - name: Centering runner
        run: |
          $out = & python tests/centering_run.py --binary build/windows/origami.exe 2>&1
          $code = $LASTEXITCODE
          $out | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/centering-run.txt"
          $out
          if ($code -ne 0) { exit $code }

      - name: Homeward
        run: |
          $out = & python tests/homeward.py --binary build/windows/origami.exe 2>&1
          $code = $LASTEXITCODE
          $out | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/homeward.txt"
          $out
          if ($code -ne 0) { exit $code }

      - name: Reference parity
        run: |
          $out = & python tests/parity.py --binary build/windows/origami.exe 2>&1
          $code = $LASTEXITCODE
          $out | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/parity.txt"
          $out
          if ($code -ne 0) { exit $code }

      - name: Native host contract
        run: |
          $out = & python native/test_host.py build/windows/origami.exe 2>&1
          $code = $LASTEXITCODE
          $out | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/host.txt"
          $out
          if ($code -ne 0) { exit $code }

      - name: Retain exact-head runtime receipt
        if: always()
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "origami-g002-windows-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          foreach ($name in @("centering.txt", "centering-run.txt", "homeward.txt", "parity.txt", "host.txt")) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item $source $evidence }
          }
          if (Test-Path "build/build-log.json") {
            Copy-Item "build/build-log.json" (Join-Path $evidence "build-log.json")
          }

          $head = (git rev-parse HEAD).Trim()
          $zigVersion = if (Get-Command zig -ErrorAction SilentlyContinue) { (zig version).Trim() } else { $null }
          $binaryHash = if (Test-Path "build/windows/origami.exe") {
            (Get-FileHash "build/windows/origami.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          } else { $null }

          $receipt = [ordered]@{
            schema = "origami-g002-windows-runtime-ci/v1"
            verifiedGitHead = $head
            expectedGitHead = $env:VERIFY_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            zigVersion = $zigVersion
            zigWindowsArchiveSHA256 = $env:ZIG_WINDOWS_SHA256
            binaryPath = "projects/origami-g002/build/windows/origami.exe"
            binarySHA256 = $binaryHash
            probes = @("centering", "centering-run", "homeward", "parity", "host")
            scope = "Exact-head Windows runtime probe of imported Origami G002 1.3.0 using Zig 0.14.1."
            claimBoundary = "This probe does not establish Windows durability, dynamic-path generation, or a physical torsional transform/inverse law."
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $evidence "WINDOWS_RUNTIME_RECEIPT.json")
          Get-Content (Join-Path $evidence "WINDOWS_RUNTIME_RECEIPT.json")

      - name: Upload exact-head runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origami-g002-windows-runtime-${{ env.VERIFY_SHA }}
          path: ${{ runner.temp }}/origami-g002-windows-evidence/
          if-no-files-found: error
          retention-days: 90
