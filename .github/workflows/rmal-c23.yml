name: RMAL C23 Toolchain

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "spec/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "projects/decision-field/**"
      - "provenance/library/RMALC.rmal"
      - "README.md"
      - "README_COMPILER.md"
      - "CURRENT.md"
      - "evidence/**"
      - "docs/RMAL_C23_WINDOWS.md"
      - ".github/workflows/rmal-c23.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "spec/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "projects/decision-field/**"
      - "provenance/library/RMALC.rmal"
      - "README.md"
      - "README_COMPILER.md"
      - "CURRENT.md"
      - "evidence/**"
      - "docs/RMAL_C23_WINDOWS.md"
      - ".github/workflows/rmal-c23.yml"

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux-clang-c23:
    name: Linux / Clang / C23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - name: Toolchain
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Configure
        run: cmake -S . -B build/linux-c23 -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/linux-c23 --parallel
      - name: Version
        run: build/linux-c23/rmalc version
      - name: Self-check
        run: build/linux-c23/rmalc selfcheck
      - name: Language spec
        run: build/linux-c23/rmalc language-spec --format json
      - name: Recovered surface
        run: build/linux-c23/rmalc check tests/recovered_surface.rmal
      - name: Historical RMALC carrier
        run: build/linux-c23/rmalc check provenance/library/RMALC.rmal
      - name: Example
        run: build/linux-c23/rmalc run examples/hello.rmal
      - name: Manifest
        run: build/linux-c23/rmalc manifest tests/recovered_surface.rmal --json
      - name: Tests
        run: ctest --test-dir build/linux-c23 --output-on-failure
      - name: Verify frozen Mirror v0.7 source identities
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive "$VERIFY_SHA" | tar -x -C "$tmp"
          mirror_cmake_blob="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("projects/decision-field/evidence/v0_7/SOURCE_MANIFEST.json").read_text())
          print(manifest["files"]["CMakeLists.txt"]["git_blob"])
          PY
          )"
          git cat-file blob "$mirror_cmake_blob" > "$tmp/CMakeLists.txt"
          python3 "$tmp/projects/decision-field/scripts/check_mirror_manifest.py" --root "$tmp"
          echo "Frozen Mirror CMake verified in temporary witness tree."
          echo "Current root CMake remains the exact-head build/test input."
      - name: Retain exact integration sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rmal-source"
          git archive --format=zip --output="$RUNNER_TEMP/rmal-source/rmal-native-source.zip" "$VERIFY_SHA" CMakeLists.txt include/rmal src tests examples/hello.rmal spec README.md README_COMPILER.md CURRENT.md scripts projects/decision-field
          printf '%s\n' "$VERIFY_SHA" > "$RUNNER_TEMP/rmal-source/SOURCE_REVISION.txt"
          sha256sum "$RUNNER_TEMP/rmal-source/rmal-native-source.zip" > "$RUNNER_TEMP/rmal-source/SHA256SUMS.txt"
      - name: Upload private reproduction source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMAL-native-source
          path: ${{ runner.temp }}/rmal-source/
          if-no-files-found: error
          retention-days: 14

  windows-clang-c23:
    name: Windows x64 / Clang / C23
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
          persist-credentials: false
      - name: Verify source identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:VERIFY_SHA) { throw "source revision mismatch" }
      - name: Toolchain
        shell: pwsh
        run: |
          Get-Command clang.exe
          clang --version
          cmake --version
          ninja --version
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/windows-c23 -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build/windows-c23 --parallel
      - name: Version
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe version
      - name: Self-check
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe selfcheck
      - name: Language spec
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe language-spec --format json
      - name: Recovered surface
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe check tests\recovered_surface.rmal
      - name: Historical RMALC carrier
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe check provenance\library\RMALC.rmal
      - name: Example
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe run examples\hello.rmal
      - name: Manifest
        shell: pwsh
        run: .\build\windows-c23\rmalc.exe manifest tests\recovered_surface.rmal --json
      - name: Tests
        shell: pwsh
        run: ctest --test-dir build/windows-c23 --output-on-failure
      - name: Install staged SDK
        shell: pwsh
        run: cmake --install build/windows-c23 --prefix stage/windows-c23 --config Release
      - name: Staged executable smoke test
        shell: pwsh
        run: |
          .\stage\windows-c23\bin\rmalc.exe version
          .\stage\windows-c23\bin\rmalc.exe selfcheck
      - name: Package Windows x64 SDK
        shell: pwsh
        run: cpack --config build/windows-c23/CPackConfig.cmake -G ZIP -B dist -D "CPACK_PACKAGE_FILE_NAME=RMAL-3.1.0-windows-x64-c23"
      - name: Upload Windows x64 SDK
        uses: actions/upload-artifact@v4
        with:
          name: RMAL-3.1.0-windows-x64-c23
          path: dist/RMAL-3.1.0-windows-x64-c23.zip
          if-no-files-found: error
