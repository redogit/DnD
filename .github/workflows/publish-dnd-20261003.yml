name: Publish DnD 2026-10-03 release

on:
  push:
    branches:
      - release/dnd-2026-10-03
    paths:
      - .github/workflows/publish-dnd-20261003.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 9f1496484051ed7349194d36f464cb2d20eef2a7
      TAG: dnd-2026-10-03
      TITLE: DnD / RMAL 3.1.0 — 2026-10-03
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Build exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=DnD-2026-10-03.zip "$TARGET_SHA"
          sha256sum DnD-2026-10-03.zip > DnD-2026-10-03.zip.sha256

      - name: Write bounded release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # DnD / RMAL 3.1.0 — 2026-10-03

          Date-stamped repository snapshot from exact master commit:
          `9f1496484051ed7349194d36f464cb2d20eef2a7`.

          RMAL remains version **3.1.0**. This release does not imply a semantic-version bump.

          ## Since the previous `programming_language` prerelease

          - **Origami G002 1.3.0 native Windows verification** merged in PR #6.
          - **Decision Field / AnyFunctor local-plane successor** merged in PR #9.
            - preserves the 2019 `BanalityOfSeeking/ServeExcel/FunctionalObject.cs` lineage as provenance;
            - introduces the finite Receive → Contextualize → Represent → Integrate stair;
            - requires plural obligations;
            - retains rejected/conflicting/incomplete observations as residuals;
            - reuses admitted local routing without output caching or occurrence collapse;
            - preserves the hash-pinned v0.7 Mirror witness.
          - GitHub Pages and repository source-link maintenance.

          PRs #7 and #8 remain open and are not included as released work.

          ## Verification

          For the PR #9 source:
          - Decision Field Local Plane: Linux PASS, Windows PASS.
          - RMAL C23 Toolchain: Linux PASS, Windows PASS.
          - Exact v0.3 predecessor archive used for native local-plane verification:
            `91a25de44269e6f54d45c5744b38af09eef2daf25b8fedbdab79ca0b4a018292`.

          ## Claim boundary

          ```text
          RELEASED != UNIVERSALLY PROVED
          ROUTE_REUSE != OUTPUT_REUSE
          AVERAGE_O(1)_ROUTE_LOOKUP != O(1)_UNDERLYING_COMPUTATION
          OPEN_PR != RELEASED_WORK
          ```
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to silently replace it."
            exit 1
          fi
          gh release create "$TAG"             DnD-2026-10-03.zip             DnD-2026-10-03.zip.sha256             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "$TITLE"             --notes-file RELEASE_NOTES.md             --prerelease
